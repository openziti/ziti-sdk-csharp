name: mattermost-ziti-webhook
on:
  issues:
  issue_comment:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
  pull_request:
    types: [opened, reopened]
  push:
  fork:
  release:
    types: [released]
  workflow_dispatch:
  watch:
    types: [started]

# The action POSTs the event payload to Mattermost over a ziti identity and never calls the GitHub API, so it
# needs no GITHUB_TOKEN at all. Empty rather than contents:read because this workflow triggers on events from
# forks, where a token with any scope is worth withholding.
permissions: {}

jobs:
  mattermost-ziti-webhook:
    runs-on: ubuntu-latest
    name: POST Webhook
    steps:
    - uses: openziti/ziti-mattermost-action-py@v1
      if: |
        github.repository_owner == 'openziti'
        && github.actor != 'dependabot[bot]'
        && ((github.event_name != 'pull_request_review')
        || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved'))
      with:
        zitiId: ${{ secrets.ZITI_MATTERMOST_IDENTITY }}
        webhookUrl: ${{ secrets.ZHOOK_URL }}
        eventJson: ${{ toJson(github.event) }}
        senderUsername: "GitHubZ"
        destChannel: "dev-notifications"